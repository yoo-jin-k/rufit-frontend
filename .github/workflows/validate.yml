name: Validate frontend
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ['feature/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: npm run export
